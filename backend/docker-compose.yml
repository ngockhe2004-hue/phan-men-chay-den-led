version: '3.8'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16 - Database chính
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: led_cms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: led_cms
      POSTGRES_USER: led_admin
      POSTGRES_PASSWORD: Led@Secure2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U led_admin -d led_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis 7 - Cache & Pub/Sub (cho WebSocket sau)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: led_cms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # MinIO - Object Storage (lưu file media)
  # Tương thích Amazon S3 API
  # ─────────────────────────────────────────────
  minio:
    image: quay.io/minio/minio:latest
    container_name: led_cms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: led_minio_admin
      MINIO_ROOT_PASSWORD: Led@Minio2026
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # MinIO Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─────────────────────────────────────────────
  # Adminer - Database GUI (để xem DB trực quan)
  # Truy cập: http://localhost:8080
  # ─────────────────────────────────────────────
  adminer:
    image: adminer:latest
    container_name: led_cms_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: led_cms_postgres_data
  redis_data:
    name: led_cms_redis_data
  minio_data:
    name: led_cms_minio_data

networks:
  default:
    name: led_cms_network
